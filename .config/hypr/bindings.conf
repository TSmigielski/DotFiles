# Windows
bind = $mainMod, $left, movefocus, l
bind = $mainMod, $right, movefocus, r
bind = $mainMod, $up, movefocus, u
bind = $mainMod, $down, movefocus, d

bind = $mainMod Shift, $left, movewindow, l
bind = $mainMod Shift, $right, movewindow, r
bind = $mainMod Shift, $up, movewindow, u
bind = $mainMod Shift, $down, movewindow, d

bind = $mainMod, F, togglefloating,
bind = $mainMod Shift, F, fullscreen,
bind = $mainMod, P, pin,

# Programs
bind = $mainMod, Return, exec, uwsm app -- $terminal
bind = $mainMod Shift, Return, exec, uwsm app -- $browser
bind = $mainMod Ctrl, Return, exec, uwsm app -- $filemanager
bind = $mainMod, D, exec, $launcher
bind = $mainMod Shift, P, exec, uwsm app -- $screenlocker

bind = $mainMod Shift, C, killactive,
bind = $mainMod Shift, M, exec, uwsm stop

bind = , Print, exec, ~/.config/hypr/utils/snip.sh
bind = SUPER, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Media controls
$changeVolume = ~/.config/hypr/utils/changeVolume.sh
bindl =, XF86AudioMute, exec, $changeVolume toggle
bindl =, XF86AudioRaiseVolume, exec, $changeVolume +2%
bindl =, XF86AudioLowerVolume, exec, $changeVolume -2%
bindl =, XF86AudioPlay, exec, playerctl play-pause && dunstify playerctl Play/Pause
bindl =, XF86AudioPause, exec, playerctl play-pause && dunstify playerctl Play/Pause
bindl =, XF86AudioNext, exec, playerctl next && dunstify playerctl Next
bindl =, XF86AudioPrev, exec, playerctl previous && dunstify playerctl Previous

bindl =, XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindl =, XF86MonBrightnessDown, exec, brightnessctl s 10-
bindl =, XF86MonBrightnessToggle, exec, brightnessctl s 10%

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
